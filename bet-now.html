<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddlines — Bet Now</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/od.css">
<style>
  .gateway{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:30px 22px;margin-top:20px;
    background:var(--surface);border:1px solid var(--line);text-align:center;}
  .gateway .glow{position:absolute;inset:auto -10% -50% -10%;height:300px;background:var(--grad);filter:blur(60px);opacity:.28;}
  .gateway > *{position:relative;}
  .gw-ico{width:72px;height:72px;border-radius:22px;margin:0 auto 18px;display:grid;place-items:center;background:var(--grad);box-shadow:0 16px 36px -10px var(--acc);}
  .gw-ico svg{width:36px;height:36px;color:#fff;}
  .gateway h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(24px,7vw,32px);line-height:1;letter-spacing:-.01em;margin-bottom:12px;}
  .gateway p{color:var(--text-2);font-size:14px;max-width:34ch;margin:0 auto 22px;text-wrap:pretty;}
  .ext-note{display:flex;align-items:center;gap:9px;justify-content:center;font-size:11.5px;color:var(--text-3);margin-top:14px;text-wrap:pretty;text-align:left;}
  .ext-note svg{width:16px;height:16px;flex:none;color:var(--acc);}
  .slip-item{display:flex;align-items:center;gap:11px;padding:13px var(--pad);}
  .slip-item + .slip-item{border-top:1px solid var(--line);}
  .slip-item .pick{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--grad);color:#fff;font-family:var(--f-num);font-weight:700;font-size:13px;flex:none;}
  .slip-item .o{margin-left:auto;font-family:var(--f-num);font-weight:700;font-size:15px;}
</style>
</head>
<body>
<div class="app"><div class="frame">
  <header id="hdr"></header>
  <main class="main">

    <section class="gateway">
      <div class="glow"></div>
      <div class="gw-ico" id="gwIco"></div>
      <h1 data-i18n="bet_t"></h1>
      <p data-i18n="bet_s"></p>
      <a class="btn btn-grad btn-block btn-lg" id="goApp" href="https://app.oddlines.bet" target="_blank" rel="noopener">
        <span data-i18n="bet_cta"></span><span id="goArrow"></span></a>
      <a class="btn btn-ghost btn-block" style="margin-top:10px" href="https://app.oddlines.bet" target="_blank" rel="noopener" data-i18n="bet_alt"></a>
      <div class="ext-note"><span id="extIco"></span><span data-i18n="bet_note"></span></div>
    </section>

    <section class="section" id="slipSection">
      <div class="section-hd"><h2 data-i18n="betslip"></h2><button id="clearSlip" style="font-size:12px;color:var(--neg);font-weight:600">✕</button></div>
      <div class="card" id="slipBox"></div>
    </section>

    <section class="section">
      <div class="section-hd"><h2 data-i18n="bet_step2"></h2></div>
      <div class="card" style="padding:4px var(--pad)" id="steps"></div>
    </section>

    <footer id="footer"></footer>
  </main>
  <nav id="tabbar"></nav>
</div></div>

<script src="js/od-data.js"></script>
<script src="js/od-app.js"></script>
<script src="js/od-tweaks.js"></script>
<script>
function resolve(id){
  const base=id.replace(/-(1|x|2)$/,''); const sel=id.slice(base.length+1);
  let ev=null; OD.allEvents().forEach(e=>{if(e.id===base)ev=e;});
  if(!ev) return null;
  const m=ev.markets.moneyline;
  const odds = sel==='1'?m[0]:sel==='x'?m[1]:m[2];
  const lbl = sel.toUpperCase();
  const team = sel==='1'?ev.home.name:sel==='2'?ev.away.name:OD.t('draw');
  return {ev,odds,lbl,team};
}

OD.render = function(){
  const I=OD.icons, t=OD.t;
  document.getElementById('gwIco').innerHTML=I.bolt;
  document.getElementById('goArrow').innerHTML=I.arrow;
  document.getElementById('extIco').innerHTML=I.shield;

  // steps
  const steps=['bet_step1','bet_step2','bet_step3'];
  document.getElementById('steps').innerHTML = steps.map((s,i)=>`<div class="step"><span class="num">${i+1}</span><span class="st" data-i18n="${s}"></span></div>`).join('');

  // slip
  const ids=OD.get('slip');
  const box=document.getElementById('slipBox');
  if(!ids.length){
    box.innerHTML=`<div class="center" style="padding:30px 20px;color:var(--text-3)">${t('betslip')} — 0<br><a href="odds.html" style="color:var(--acc);font-weight:600;font-size:13px;display:inline-block;margin-top:8px">${t('oddsboard')} →</a></div>`;
  } else {
    box.innerHTML = ids.map(id=>{const r=resolve(id); if(!r)return''; 
      return `<div class="slip-item"><span class="pick">${r.lbl}</span>
        <div><div style="font-weight:600;font-size:13.5px">${r.team}</div>
        <div class="match-meta">${r.ev.home.abbr} v ${r.ev.away.abbr} · ${r.ev.league}</div></div>
        <span class="o">${OD.fmtOdds(r.odds,OD.get('odds'))}</span></div>`;}).join('');
  }
  document.getElementById('clearSlip').onclick=()=>{OD.set('slip',[]);OD.render();OD.applyI18n();OD.paintSlip();};
};
OD.render();
OD.boot('bet');
</script>
</body>
</html>
