<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oddlines — Screens Showcase</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0a1119;}
  .ph{display:block;border:0;width:402px;height:874px;background:#00101D;border-radius:38px;}
  .cap{font-family:'Hanken Grotesk',system-ui;font-size:12px;color:#8aa;line-height:1.5;padding:0 4px 6px;max-width:380px;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const { useState } = React;

function Screen({src}){
  return (
    <IOSDevice dark width={402} height={874}>
      <iframe className="ph" src={src} title={src}></iframe>
    </IOSDevice>
  );
}

function App(){
  return (
    <DesignCanvas>
      <DCSection id="home" title="Homepage" subtitle="Three hero directions — same system, different lead">
        <DCArtboard id="ha" label="A · Featured spotlight" width={402} height={874}><Screen src="index.html?embed=1&hero=a"/></DCArtboard>
        <DCArtboard id="hb" label="B · Bold statement + live ticker" width={402} height={874}><Screen src="index.html?embed=1&hero=b"/></DCArtboard>
        <DCArtboard id="hc" label="C · Search & sport-grid first" width={402} height={874}><Screen src="index.html?embed=1&hero=c"/></DCArtboard>
      </DCSection>

      <DCSection id="core" title="Core screens" subtitle="All Sports · Odds · Bet Now · Help · About">
        <DCArtboard id="odds" label="Odds Board" width={402} height={874}><Screen src="odds.html?embed=1"/></DCArtboard>
        <DCArtboard id="sports" label="All Sports" width={402} height={874}><Screen src="sports.html?embed=1"/></DCArtboard>
        <DCArtboard id="bet" label="Bet Now (gateway → app)" width={402} height={874}><Screen src="bet-now.html?embed=1"/></DCArtboard>
        <DCArtboard id="help" label="Help Center" width={402} height={874}><Screen src="help.html?embed=1"/></DCArtboard>
        <DCArtboard id="about" label="About Us" width={402} height={874}><Screen src="about.html?embed=1"/></DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
