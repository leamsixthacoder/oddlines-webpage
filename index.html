<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oddlines — Sharper lines, smarter bets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/od.css">
</head>
<body>
<div class="app"><div class="frame">
  <header id="hdr"></header>
  <main class="main">
    <div class="home-grid">
      <aside class="home-side" id="homeSide"></aside>
      <div class="home-main">

        <div class="home-search">
          <span id="searchIco"></span>
          <input data-i18n-ph="h_explore" aria-label="Search sports, teams and players">
        </div>

        <section class="section" style="margin-top:16px">
          <div class="cat-rail" id="catRail"></div>
        </section>

        <section class="section" id="promos" style="margin-top:18px">
          <div class="promo-row" id="promoRow"></div>
          <p class="promo-terms" data-i18n="promo_terms"></p>
        </section>

        <section class="section" style="margin-top:18px">
          <div class="chip-row" id="chipRow"></div>
        </section>

        <div id="boostWrap"></div>

        <section class="section">
          <div class="builder" id="builder"></div>
        </section>

        <section class="section">
          <div class="section-hd"><h2 data-i18n="h_value"></h2></div>
          <div class="card" id="valueList"></div>
        </section>

      </div>
    </div>

    <footer id="footer"></footer>
  </main>
  <nav id="tabbar"></nav>
</div></div>

<script src="js/od-data.js"></script>
<script src="js/od-app.js"></script>
<script src="js/od-home.js"></script>
<script src="js/od-tweaks.js"></script>
<script>
(function(){
  const I=OD.icons;
  const vals=[{i:'star',t:'v1t',d:'v1d'},{i:'zap',t:'v2t',d:'v2d'},{i:'shield',t:'v3t',d:'v3d'}];
  document.getElementById('valueList').innerHTML = vals.map(v=>`<div class="value"><span class="vi">${I[v.i]}</span><div><h3 data-i18n="${v.t}"></h3><p data-i18n="${v.d}"></p></div></div>`).join('');
  OD.render = OD.renderHome;
  OD.render();
  OD.boot('home');
})();
</script>
</body>
</html>
